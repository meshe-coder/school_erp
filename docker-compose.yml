version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: school_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgres://erp_user:change-me@postgres:5432/school_erp
      - SESSION_SECRET=super-secret-session-key-change-me
      - CORS_ORIGIN=http://localhost:3000
      - SEED_ADMIN_USERNAME=admin
      - SEED_ADMIN_EMAIL=admin@example.com
      - SEED_ADMIN_PASSWORD=ChangeMe123!
      - MPESA_CONSUMER_KEY=sandbox_key_here
      - MPESA_CONSUMER_SECRET=sandbox_secret_here
      - MPESA_SHORTCODE=174379
      - MPESA_PASSKEY=sandbox_passkey_here
      - MPESA_CALLBACK_URL=https://your-domain.com/api/mpesa/callback
    depends_on:
      - postgres

volumes:
  pgdata:
