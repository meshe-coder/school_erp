<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Students - School ERP</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body hidden>
  <header class="app-header" data-app-nav></header>
  <main class="container">
    <div class="page-heading">
      <div><p class="eyebrow">People</p><h1>Students</h1></div>
      <button id="add-student-button" type="button" class="primary-button">Add student</button>
    </div>

    <section class="card">
      <div class="filter-grid">
        <div class="field"><label for="student-search">Search</label><input id="student-search" type="search" placeholder="Admission number or name"></div>
        <div class="field"><label for="student-class">Class</label><select id="student-class"><option value="">All classes</option></select></div>
        <div class="field"><label for="student-status">Status</label><select id="student-status"><option value="">All statuses</option><option value="active">Active</option><option value="graduated">Graduated</option><option value="transferred">Transferred</option><option value="suspended">Suspended</option></select></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Admission number</th><th>Name</th><th>Class</th><th>Status</th></tr></thead>
          <tbody data-student-table><tr><td colspan="4" class="loading-state">Loading students...</td></tr></tbody>
        </table>
      </div>
      <div class="pagination" data-student-pagination></div>
    </section>

    <dialog id="add-student-dialog" class="modal">
      <div class="modal-card">
        <div class="modal-header"><h2>Add student</h2><button type="button" class="icon-button" data-close-dialog aria-label="Close">&times;</button></div>
        <div class="modal-body">
          <form id="add-student-form">
            <div class="form-grid">
              <div class="field"><label for="admissionNumber">Admission number</label><input id="admissionNumber" name="admissionNumber" required maxlength="30"></div>
              <div class="field"><label for="firstName">First name</label><input id="firstName" name="firstName" required maxlength="60"></div>
              <div class="field"><label for="lastName">Last name</label><input id="lastName" name="lastName" required maxlength="60"></div>
              <div class="field"><label for="gender">Gender</label><select id="gender" name="gender"><option value="">Not set</option><option value="male">Male</option><option value="female">Female</option></select></div>
              <div class="field"><label for="dateOfBirth">Date of birth</label><input id="dateOfBirth" name="dateOfBirth" type="date"></div>
              <div class="field"><label for="classId">Class</label><select id="classId" name="classId"><option value="">No class</option></select></div>
              <div class="field field-wide"><label for="guardianName">Guardian name</label><input id="guardianName" name="guardianName" maxlength="120"></div>
              <div class="field"><label for="guardianRelationship">Relationship</label><input id="guardianRelationship" name="guardianRelationship" maxlength="30" placeholder="Mother, father, uncle..."></div>
              <div class="field"><label for="guardianPhone">Guardian phone</label><input id="guardianPhone" name="guardianPhone" maxlength="30" placeholder="0712345678"></div>
            </div>
            <button id="save-student-button" type="submit" class="primary-button">Create student</button>
          </form>
        </div>
      </div>
    </dialog>
  </main>
  <script type="module" src="/js/pages/admin-students.js"></script>
</body>
</html>
