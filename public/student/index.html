<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Account - School ERP</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body hidden>
  <header class="app-header" data-app-nav></header>
  <main class="container">
    <div class="page-heading">
      <div>
        <p class="eyebrow">Student account</p>
        <h1 data-student-name>Loading...</h1>
        <p data-student-meta></p>
      </div>
      <button id="refresh-button" type="button" class="secondary-button">Refresh</button>
    </div>

    <section class="card balance-card" data-balance-card>
      <p class="loading-state">Loading account balance...</p>
    </section>

    <!-- New Payment Section -->
    <section class="card" data-payment-section hidden>
      <h2>Make a Payment</h2>
      <div class="payment-controls">
        <div class="payment-methods">
          <button id="mpesa-btn" class="payment-method-btn active" data-method="mpesa">
            <svg class="payment-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            M-Pesa
          </button>
          <button id="cash-btn" class="payment-method-btn" data-method="cash">
            <svg class="payment-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="10" y="10" width="14" height="14" rx="2" ry="2"></rect>
              <path d="M2 2h20v20H2z"></path>
            </svg>
            Cash
          </button>
        </div>

        <div id="mpesa-payment-form" class="payment-form" hidden>
          <div class="form-group">
            <label for="amount">Amount (KES)</label>
            <input type="number" id="amount" min="1" step="0.01" placeholder="Enter amount" required>
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="254XXXXXXXXX" required>
          </div>
          <button id="pay-button" type="button" class="primary-button">Pay with M-Pesa</button>
          <div id="payment-status" class="payment-status"></div>
        </div>

        <div id="cash-payment-form" class="payment-form" hidden>
          <div class="form-group">
            <label for="cash-amount">Amount (KES)</label>
            <input type="number" id="cash-amount" min="1" step="0.01" placeholder="Enter amount" required>
          </div>
          <button id="cash-pay-button" type="button" class="primary-button">Record Cash Payment</button>
          <div id="cash-payment-status" class="payment-status"></div>
        </div>
      </div>
    </section>

    <section class="card" data-payment-instructions hidden>
      <h2>How to pay</h2>
      <p data-payment-instructions-text></p>
    </section>

    <section class="card">
      <div class="section-heading">
        <h2>Fees by term</h2>
        <span data-last-updated></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Term</th><th>Billed</th><th>Paid</th><th>Remaining</th><th>Status</th></tr></thead>
          <tbody data-bills-table><tr><td colspan="5" class="loading-state">Loading...</td></tr></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2>Payments</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Method</th><th>Reference</th><th>Amount</th><th>Status</th></tr></thead>
          <tbody data-payments-table><tr><td colspan="5" class="loading-state">Loading...</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <script type="module" src="/js/pages/student.js"></script>
</body>
</html>
