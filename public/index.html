<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - School ERP</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <h1 data-school-name>My School</h1>
      <p>Log in to your portal.</p>
      <form id="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-row">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button id="toggle-password" type="button" class="secondary-button">Show</button>
          </div>
        </div>
        <button class="primary-button" type="submit">Log in</button>
      </form>
      <p class="muted">Students: your username is your admission number.</p>
    </section>
  </main>
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
