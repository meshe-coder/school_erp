<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password - School ERP</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <h1>Change password</h1>
      <p>You must choose a new password before continuing.</p>
      <p>Use at least 8 characters with a letter and a number.</p>
      <form id="change-password-form">
        <div class="field">
          <label for="currentPassword">Current password</label>
          <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required>
        </div>
        <div class="field">
          <label for="newPassword">New password</label>
          <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
        </div>
        <button class="primary-button" type="submit">Change password</button>
      </form>
      <p><a href="#" id="logout-link">Log out</a></p>
    </section>
  </main>
  <script type="module" src="/js/pages/change-password.js"></script>
</body>
</html>
